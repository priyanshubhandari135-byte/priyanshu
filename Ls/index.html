    body {

    :root {

    .page {

        justify-content: center;
        align-items: center;
        min-height: 100svh;
        padding: clamp(16px,4vw,32px);
        display: flex

    .poster {

        align-items: center;

        overflow: hidden;

    .bg-pattern {

        width: 100%;
        height: 100%;

        inset: 0

    .paper-plane {
        z-index: 1;
        pointer-events: none;
        width: clamp(30px,11cqi,48px);
        height: auto;
        position: absolute;
        top: 6.8cqi;
        left: 6.6%
    }
    
    .leaf {
        z-index: 0;

        pointer-events: none;
        width: clamp(42px,14cqi,62px);
        height: auto;
        position: absolute;
        bottom: -2%
    }
    
    .leaf-left {
        left: -2%
    }

        right: -2%;

    }
    
    .hero {

    .bell-circle img {

        overflow: hidden;

    }

    }
    
    .cta:active {

    }

        pointer-events: none;
        background: #ffffff26;
        border-radius: 50px 50px 0 0;
        height: 48%;
        position: absolute;
        top: 0;
        left: 12%;
